pluginManagement {
    repositories {
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        mavenCentral()
        gradlePluginPortal()
    }

    plugins {
        id "net.fabricmc.fabric-loom-remap" version "1.17.21"
        id "net.fabricmc.fabric-loom" version "1.17.21"
    }
}

rootProject.name = "DamageNumbers"

